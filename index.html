<title>Les Productions Maison Perron · Maison Perron Productions</title>
<style>
  :root {
    --night: #120a26; --night-2: #07070d; --gold: #ffd23f; --pink: #ff5ea8; --red: #d1301f;
    --paper: #f6f0e3; --paper-2: #ebe4d6; --ink: #161412; --muted: #6b645a; --lilac: #b9b3cc;
    --head: "Archivo Black", "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
    --body: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --pixel: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--ink); font: 16px/1.5 var(--body);
    background: linear-gradient(180deg, #1a0f3a 0, var(--night-2) 900px) no-repeat, var(--night-2);
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  button { font: inherit; }
  a { color: var(--red); }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ── Header ── */
  header { position: relative; text-align: center; display: flex; flex-direction: column; gap: 8px; padding: 0 56px; }
  .kicker { margin: 0; font: 700 11px/1.4 var(--pixel); color: var(--pink); letter-spacing: .25em; text-transform: uppercase; }
  h1 { margin: 0; font: 900 clamp(30px, 5.6vw, 60px)/.95 var(--head); text-transform: uppercase; color: var(--gold); letter-spacing: -.01em; }
  .tagline { margin: 0; color: var(--lilac); font-size: 15px; }
  .lang { position: absolute; top: 0; right: 0; min-width: 48px; min-height: 44px; background: transparent; color: #f2f0f7; border: 2px solid #4b4b80; font: 700 14px var(--pixel); cursor: pointer; }
  .lang:hover { border-color: var(--gold); color: var(--gold); }

  /* ── The spread ── */
  .spread { display: flex; flex-wrap: wrap; box-shadow: 0 24px 0 -10px var(--night-2), 0 0 0 1px #000; }
  .toc { flex: 1 1 340px; background: var(--paper-2); padding: 26px 22px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset -18px 0 24px -18px rgba(0,0,0,.45); }
  .toc h2 { margin: 0 0 8px; font: 900 26px/1 var(--head); text-transform: uppercase; }
  .toc h3 { margin: 18px 0 6px; font: 700 11px/1.4 var(--pixel); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); border-top: 2px solid var(--ink); padding-top: 12px; }
  .entry { display: grid; grid-template-columns: 40px 64px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left; padding: 9px 10px; background: transparent; color: var(--ink); border: 0; border-left: 6px solid transparent; cursor: pointer; }
  .entry:hover { background: rgba(22,20,18,.07); }
  .entry[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-left-color: var(--pink); }
  .entry .no { font: 900 24px/1 var(--head); color: var(--red); }
  .entry[aria-pressed="true"] .no { color: var(--gold); }
  .entry img, .entry .ph { width: 64px; aspect-ratio: 1 / 1; object-fit: cover; image-rendering: pixelated; border: 2px solid var(--ink); display: block; }
  .entry .t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .entry strong { font-size: 16px; line-height: 1.25; }
  .entry .s { font-size: 12.5px; opacity: .85; }
  .entry .dev { display: flex; gap: 7px; align-items: center; margin-top: 3px; opacity: .8; }
  .entry .dev svg { width: 15px; height: 15px; display: block; }
  .entry .dev .x2 { font: 700 10px/1 var(--pixel); margin-left: -4px; }
  .entry.soon { opacity: .78; }
  .entry.soon .no { color: var(--muted); }
  .entry.soon[aria-pressed="true"] { opacity: 1; }


  .feature { flex: 2 1 560px; min-width: 0; background: var(--paper); padding: 26px 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 18px 0 24px -18px rgba(0,0,0,.35); scroll-margin-top: 16px; }
  .folio { display: flex; justify-content: space-between; gap: 12px; font: 700 12px/1.4 var(--body); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .feature h2 { margin: 0; font: 900 clamp(36px, 5vw, 56px)/.95 var(--head); }
  .shot { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; display: block; border: 4px solid var(--ink); image-rendering: pixelated; background: #000; }
  /* Placeholder art for games in the works (drawn in CSS, no files) */
  .entry .ph, .shot.ph { display: grid; place-items: center; font: 900 28px/1 var(--head); color: #fff; }
  .shot.ph { font-size: clamp(60px, 10vw, 120px); }
  .ph.ph-perrocles { background: #b4532a repeating-linear-gradient(90deg, transparent 0 10px, rgba(0,0,0,.18) 10px 12px); color: #1b0f08; }
  .ph.ph-plow { background: #dfe9f5 radial-gradient(#fff 2px, transparent 2.5px) 0 0 / 12px 12px; color: #1f4a7a; }
  .ph.ph-brawler { background: #7a1424 repeating-linear-gradient(135deg, transparent 0 9px, rgba(255,255,255,.12) 9px 12px); color: #fff; }
  .ph.ph-knit { background: linear-gradient(135deg, rgba(255,255,255,.22) 25%, transparent 25%) -6px 0 / 12px 12px, linear-gradient(225deg, rgba(255,255,255,.22) 25%, transparent 25%) -6px 0 / 12px 12px, #b8456b; color: #fff; letter-spacing: -.1em; }
  .entry .ph.ph-knit { font-size: 20px; }
  .cols { display: flex; flex-wrap: wrap; gap: 24px; }
  .story { flex: 2 1 280px; display: flex; flex-direction: column; gap: 12px; }
  .story p { margin: 0; font-size: 17px; line-height: 1.6; }
  .quote { font: 900 22px/1.2 var(--head) !important; color: var(--red); border-left: 6px solid var(--red); padding-left: 14px; }
  .box { flex: 1 1 210px; display: flex; flex-direction: column; gap: 10px; background: var(--ink); color: var(--paper); padding: 16px; align-self: flex-start; }
  .box .lbl { margin: 0; font: 700 10px/1.4 var(--pixel); color: var(--pink); letter-spacing: .15em; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat span { font-size: 11px; font-weight: 700; letter-spacing: .1em; }
  .bar { display: flex; gap: 4px; }
  .bar i { flex: 1; height: 10px; background: #3a352c; }
  .bar i.on { background: var(--gold); }
  .meta { margin: 4px 0 0; font-size: 12.5px; color: #cfc8ba; }
  .stampline { margin: 0; font-size: 12.5px; color: #cfc8ba; border-top: 1px dashed #4a443a; padding-top: 8px; }
  .stampline b { color: var(--gold); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .start { display: inline-block; background: var(--pink); color: var(--ink); font: 700 13px/1 var(--pixel); letter-spacing: .08em; text-decoration: none; padding: 17px 22px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  .start:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
  .readme { font-weight: 700; font-size: 15px; }
  .soon-badge { font: 700 12px/1 var(--pixel); letter-spacing: .1em; padding: 12px 14px; border: 3px dashed var(--ink); color: var(--ink); }

  /* ── The test ── */
  .test { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: #f2f0f7; }
  .test .name { font: 900 20px/1 var(--head); text-transform: uppercase; color: var(--gold); }
  .test .q { font-size: 16px; font-weight: 600; }
  .test .ans { min-height: 46px; padding: 0 16px; background: transparent; color: #f2f0f7; border: 2px solid var(--pink); font-weight: 700; cursor: pointer; }
  .test .ans:hover { background: var(--pink); color: var(--ink); }
  .test .again { margin-left: auto; min-height: 44px; padding: 0 12px; background: transparent; color: var(--lilac); border: 1px solid #4b4b80; cursor: pointer; }

  footer { text-align: center; font-size: 13px; color: var(--lilac); }
  footer a { color: var(--gold); }

  @media (max-width: 640px) {
    header { padding: 0 52px 0 0; text-align: left; }
    .feature { padding: 22px 18px; }
    .toc { padding: 22px 14px; }
    .test .again { margin-left: 0; }
  }
</style>
</head>

    quick: { q: { fr: 'Un doigt ou la musique ?', en: 'One finger, or music?' }, a: [[{ fr: 'Un doigt', en: 'One finger' }, 'mort-aux-trousses'], [{ fr: 'La musique', en: 'Music' }, 'kick-la-banane']] },
    long:  { q: { fr: 'Construire, battre des boss, ou piloter ?', en: 'Build, beat bosses, or fly?' }, a: [[{ fr: 'Construire', en: 'Build' }, 'mine-moule'], [{ fr: 'Les boss', en: 'Bosses' }, 'boss'], [{ fr: 'Piloter', en: 'Fly' }, 'patrouille-kepler']] },
    boss:  { q: { fr: 'Plateformes 8-bit ou mythes grecs ?', en: '8-bit platforms or Greek myths?' }, a: [[{ fr: 'Plateformes', en: 'Platforms' }, 'blocsauteur'], [{ fr: 'Mythes grecs', en: 'Greek myths' }, 'perrocles']] },
    done:  { q: { fr: 'Voilà ton jeu, page de droite.', en: 'There’s your game, on the right-hand page.' }, a: [] },
  };
  // Small line icons for what a game plays on (drawn inline, no files).
  const DEVICES = {
    keyboard: { fr: 'Clavier', en: 'Keyboard', d: 'M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10' },
    gamepad:  { fr: 'Manette', en: 'Gamepad', d: 'M7 7h10a5 5 0 0 1 4.7 6.7l-.9 2.6a2.5 2.5 0 0 1-4.2.8L14.5 15h-5l-2.1 2.1a2.5 2.5 0 0 1-4.2-.8l-.9-2.6A5 5 0 0 1 7 7zM7 10v4M5 12h4M15.5 11h.01M18 13h.01' },
    gamepad2: { fr: 'Deux manettes', en: 'Two gamepads', d: 'M7 7h10a5 5 0 0 1 4.7 6.7l-.9 2.6a2.5 2.5 0 0 1-4.2.8L14.5 15h-5l-2.1 2.1a2.5 2.5 0 0 1-4.2-.8l-.9-2.6A5 5 0 0 1 7 7zM7 10v4M5 12h4M15.5 11h.01M18 13h.01', x2: true },
    tablet:   { fr: 'Tablette', en: 'Tablet', d: 'M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM12 18h.01' },
    phone:    { fr: 'Téléphone', en: 'Phone', d: 'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2' },
    mouse:    { fr: 'Souris', en: 'Mouse', d: 'M12 3a6 6 0 0 1 6 6v6a6 6 0 0 1-12 0V9a6 6 0 0 1 6-6zM12 7v3' },
  };
  function deviceRow(g) {
    const row = el('span', 'dev');
    const names = (g.input || []).map((k) => DEVICES[k][lang]);
    if (!names.length) return null;
    row.setAttribute('role', 'img');
    row.setAttribute('aria-label', (lang === 'fr' ? 'Se joue avec : ' : 'Plays with: ') + names.join(', '));
    for (const k of g.input) {
      const dv = DEVICES[k], NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '1.8'); svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      const t = document.createElementNS(NS, 'title'); t.textContent = dv[lang]; svg.append(t);
      const path = document.createElementNS(NS, 'path'); path.setAttribute('d', dv.d); svg.append(path);
      row.append(svg);
      if (dv.x2) row.append(el('span', 'x2', '×2'));
    }
    return row;
  }
  const STAT_LABELS = { fr: ['ACTION', 'RÉFLEXION', 'DURÉE', 'DIFFICULTÉ'], en: ['ACTION', 'THINKING', 'LENGTH', 'DIFFICULTY'] };

  // ── State ─────────────────────────────────────────────────────────────
  let lang = 'fr', node = 'start';
  try { const s = localStorage.getItem('maisonPerron.lang'); if (s === 'en' || s === 'fr') lang = s; } catch (e) { }
  const ALL = [...GAMES, ...SOON];
  const byId = (id) => ALL.find((g) => g.id === id);
  const stampFor = (g) => g.file && document.querySelector('.stamp[data-file="' + g.file + '"]');
  const stampDate = (g) => { const s = stampFor(g); const d = s && s.dataset.date ? new Date(s.dataset.date) : null; return d && !isNaN(d) ? d : null; };
  // Open on the game named in the address (#mine-moule), else the newest game (last in GAMES).
  const newest = () => GAMES[GAMES.length - 1].id;
  let sel = byId(location.hash.slice(1)) ? location.hash.slice(1) : newest();

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const pad = (n) => String(n).padStart(2, '0');

  function stampText(g) {
    const s = stampFor(g); if (!s) return null;
    const { ver, date, rev } = s.dataset; const parts = [];
    if (ver) parts.push(['b', 'v' + ver]); else if (rev) parts.push(['', lang === 'fr' ? 'rév. ' : 'rev. '], ['b', rev]);
    const d = date ? new Date(date) : null;
    if (d && !isNaN(d)) parts.push(['', ' · ' + (lang === 'fr' ? 'mis à jour le ' : 'updated ') + new Intl.DateTimeFormat(lang === 'fr' ? 'fr-CA' : 'en-CA', { year: 'numeric', month: 'long', day: 'numeric' }).format(d)]);
    return parts;
  }

  // ── Rendering ─────────────────────────────────────────────────────────
  function entry(g, i, soon) {
    const b = el('button', 'entry' + (soon ? ' soon' : ''));
    b.type = 'button'; b.dataset.id = g.id; b.setAttribute('aria-pressed', String(g.id === sel));
    b.append(el('span', 'no', pad(i)));
    if (g.img) { const im = el('img'); im.src = g.img; im.alt = ''; im.loading = 'lazy'; b.append(im); }
    else b.append(el('span', 'ph ' + g.ph, g.mark));
    const t = el('span', 't'); t.append(el('strong', '', g.name[lang]), el('span', 's', soon ? g.status[lang] : g.tag[lang]));
    const dev = deviceRow(g); if (dev) t.append(dev);
    b.append(t);
    b.addEventListener('click', () => select(g.id, true));
    return b;
  }

  function renderToc() {
    // Numbered by age (01 = oldest), listed newest first.
    $('toc-games').replaceChildren(...GAMES.map((g, i) => entry(g, i + 1, false)).reverse());
    $('toc-soon').replaceChildren(...SOON.map((g, i) => entry(g, GAMES.length + i + 1, true)));
  }

  function renderFeature() {
    const g = byId(sel), soon = !g.file, f = $('feature');
    const folio = el('div', 'folio'); folio.append(el('span', '', g.tag[lang]), el('span', '', (lang === 'fr' ? 'Page ' : 'Page ') + g.page));
    const h = el('h2', '', g.name[lang]);
    let shot;
    if (g.img) { shot = el('img', 'shot'); shot.src = g.img; shot.alt = (lang === 'fr' ? 'Écran de ' : 'Screen from ') + g.name[lang]; }
    else { shot = el('div', 'shot ph ' + g.ph, g.mark); shot.setAttribute('role', 'img'); shot.setAttribute('aria-label', lang === 'fr' ? 'Illustration à venir' : 'Artwork to come'); }

    const cols = el('div', 'cols');
    const story = el('div', 'story'); story.append(el('p', '', g.pitch[lang]));
    if (g.quote) story.append(el('p', 'quote', '« ' + g.quote[lang] + ' »'));
    const box = el('div', 'box');
    if (soon) {
      box.append(el('p', 'lbl', lang === 'fr' ? 'STATUT' : 'STATUS'), el('strong', '', g.status[lang]), el('p', 'meta', g.meta[lang]));
    } else {
      box.append(el('p', 'lbl', 'STATS'));
      g.stats.forEach((v, i) => {
        const s = el('div', 'stat'); s.append(el('span', '', STAT_LABELS[lang][i]));
        const bar = el('div', 'bar'); bar.setAttribute('role', 'img'); bar.setAttribute('aria-label', v + ' / 5');
        for (let n = 1; n <= 5; n++) bar.append(el('i', n <= v ? 'on' : ''));
        s.append(bar); box.append(s);
      });
      box.append(el('p', 'meta', g.meta[lang]));
      const st = stampText(g);
      if (st) { const p = el('p', 'stampline'); st.forEach(([tag, txt]) => p.append(tag ? el(tag, '', txt) : document.createTextNode(txt))); box.append(p); }
    }
    cols.append(story, box);

    const actions = el('div', 'actions');
    if (soon) {
      actions.append(el('span', 'soon-badge', lang === 'fr' ? 'BIENTÔT' : 'COMING SOON'));
      if (g.readme) { const rd = el('a', 'readme', lang === 'fr' ? 'Le plan →' : 'The plan →'); rd.href = g.readme; actions.append(rd); }
    }
    else {
      const play = el('a', 'start', lang === 'fr' ? 'APPUIE SUR START' : 'PRESS START'); play.href = g.file;
      const rd = el('a', 'readme', lang === 'fr' ? 'Règles et contrôles →' : 'Rules and controls →'); rd.href = g.readme;
      actions.append(play, rd);
    }
    f.replaceChildren(folio, h, shot, cols, actions);
  }

  function renderTest() {
    const n = TREE[node];
    $('test-q').textContent = n.q[lang];
    $('test-a').replaceChildren(...n.a.map(([label, to]) => {
      const b = el('button', 'ans', label[lang]); b.type = 'button';
      b.addEventListener('click', () => { if (byId(to)) { node = 'done'; select(to, true); } else { node = to; renderTest(); } });
      return b;
    }));
    $('test-again').hidden = node === 'start';
  }

  function applyLang() {
    document.documentElement.lang = lang;
    for (const n of document.querySelectorAll('[data-fr]')) n.textContent = n.dataset[lang];
    $('lang').textContent = lang === 'fr' ? 'EN' : 'FR';
    renderToc(); renderFeature(); renderTest();
  }

  function select(id, user) {
    sel = id;
    try { history.replaceState(null, '', '#' + id); } catch (e) { }
    for (const b of document.querySelectorAll('.entry')) b.setAttribute('aria-pressed', String(b.dataset.id === id));
    renderFeature(); renderTest();
    // On narrow screens the feature sits below the contents: bring it into view.
    if (user && window.matchMedia('(max-width: 920px)').matches) $('feature').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Live refresh of versions and dates on GitHub Pages ───────────────
  const REPO = 'u269c/Maison-Perron';
  async function refreshLive() {
    if (!/^https?:$/.test(location.protocol)) return;
    await Promise.all([...document.querySelectorAll('.stamp')].map(async (s) => {
      const file = s.dataset.file;
      try { const m = (await (await fetch(file, { cache: 'no-cache' })).text()).match(/\bVERSION\s*=\s*['"]v?(\d[^'"]*)['"]/); if (m) s.dataset.ver = m[1]; } catch (e) { }
      try {
        const r = await fetch('https://api.github.com/repos/' + REPO + '/commits?per_page=1&path=' + encodeURIComponent(file));
        if (r.ok) { const [c] = await r.json(); if (c) { s.dataset.date = c.commit.author.date; s.dataset.rev = c.sha.slice(0, 7); } }
      } catch (e) { }
    }));
    renderFeature();
  }

  $('lang').addEventListener('click', () => { lang = lang === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('maisonPerron.lang', lang); } catch (e) { } applyLang(); });
  $('test-again').addEventListener('click', () => { node = 'start'; renderTest(); });
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (byId(id) && id !== sel) select(id, false); });
  // Up/down arrows move through the contents.
  document.querySelector('.toc').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const list = [...document.querySelectorAll('.entry')], i = list.indexOf(document.activeElement);
    if (i < 0) return; e.preventDefault();
    const next = list[(i + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length]; next.focus(); select(next.dataset.id, false);
  });

  applyLang();
  refreshLive();
})();
</script>
</body>
</html>
