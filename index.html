<style>
  :root { --ink: #f4eaff; --dim: #b9a8d6; --gold: #ffd23f; --bg: #120a1f; --card: #1f1233; --edge: #3a2360; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  body { padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin: 8px 0 28px; }
  h1 { margin: 0 56px; font-size: clamp(22px, 4.6vw, 42px); letter-spacing: .06em; color: var(--gold); text-shadow: 3px 3px 0 #000, 0 0 18px rgba(255, 210, 63, .35); text-transform: uppercase; }
  .tag { margin: 8px 0 0; color: var(--dim); }
  .lang { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); background: var(--card); color: var(--ink); border: 2px solid var(--edge); padding: 6px 10px; font: inherit; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  a.game { display: flex; flex-direction: column; text-decoration: none; color: inherit; background: var(--card); border: 3px solid var(--edge); box-shadow: 4px 4px 0 #000; transition: transform .08s, border-color .08s; }
  a.game:hover, a.game:focus-visible { transform: translate(-2px, -2px); border-color: var(--gold); outline: none; }
  a.game img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; image-rendering: pixelated; background: #000; display: block; border-bottom: 3px solid var(--edge); }
  .body { padding: 12px 14px 12px; flex: 1; display: flex; flex-direction: column; }
  h2 { margin: 0 0 6px; font-size: 18px; color: var(--gold); }
  .body p { margin: 0 0 10px; font-size: 14px; color: var(--ink); }
  .meta { font-size: 12px; color: var(--dim); margin-bottom: 10px; }
  .stamp { margin-top: auto; padding-top: 10px; border-top: 2px dashed var(--edge); font-size: 11px; color: var(--dim); }
  .stamp b { color: var(--gold); font-weight: 700; }
  footer { margin-top: 32px; text-align: center; font-size: 13px; color: var(--dim); }
  footer a { color: var(--gold); }
</style>
</head>
<body>

        <div class="meta" data-fr="Clavier · tactile · manette" data-en="Keyboard · touch · gamepad"></div>

        <div class="stamp" data-file="games/tic-tac-toe-3/tic-tac-toe-3.html" data-ver="" data-date="2026-11-16T17:46:11-05:00" data-rev="527bafd"></div></div>

  <footer><span data-fr="Code source et histoire :" data-en="Source code and history:"></span>

</main>
<script>
  (() => {
    'use strict';
    let lang = 'fr';
    try { const s = localStorage.getItem('maisonPerron.lang'); if (s === 'en' || s === 'fr') lang = s; } catch (e) { }
    const btn = document.getElementById('lang');
    function apply() {
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll('[data-fr]')) el.textContent = el.dataset[lang];
      btn.textContent = lang === 'fr' ? 'EN' : 'FR';
      renderStamps();
    }

    // ── Version + last-update line at the bottom of each card ─────────────
    // data-ver / data-date / data-rev are baked in by tools/stamp-launcher.py,
    // so the page works when opened from disk. When served over the web
    // (GitHub Pages), refreshLive() updates them from the game file itself
    // and from the GitHub API. Dates are ISO timestamps, shown in the
    // reader's own time zone.
    const REPO = 'u269c/Maison-Perron';
    function renderStamps() {
      const fmt = new Intl.DateTimeFormat(lang === 'fr' ? 'fr-CA' : 'en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
      for (const el of document.querySelectorAll('.stamp')) {
        const { ver, date, rev } = el.dataset;
        const parts = [];
        if (ver) parts.push('<b>v' + ver + '</b>');
        else if (rev) parts.push((lang === 'fr' ? 'rév. ' : 'rev. ') + '<b>' + rev + '</b>');
        const d = date ? new Date(date) : null;
        if (d && !isNaN(d)) parts.push((lang === 'fr' ? 'mis à jour le ' : 'updated ') + fmt.format(d));
        el.innerHTML = parts.join(' · ');
        el.hidden = parts.length === 0;
      }
    }
    async function refreshLive() {
      if (!/^https?:$/.test(location.protocol)) return;
      await Promise.all([...document.querySelectorAll('.stamp')].map(async (el) => {
        const file = el.dataset.file;
        try {
          const html = await (await fetch(file, { cache: 'no-cache' })).text();
          const m = html.match(/\bVERSION\s*=\s*['"]v?(\d[^'"]*)['"]/);
          if (m) el.dataset.ver = m[1];
        } catch (e) { }
        try {
          const r = await fetch('https://api.github.com/repos/' + REPO + '/commits?per_page=1&path=' + encodeURIComponent(file));
          if (r.ok) {
            const [c] = await r.json();
            if (c) { el.dataset.date = c.commit.author.date; el.dataset.rev = c.sha.slice(0, 7); }
          }
        } catch (e) { }
      }));
      renderStamps();
    }

    btn.addEventListener('click', () => {
      lang = lang === 'fr' ? 'en' : 'fr';
      try { localStorage.setItem('maisonPerron.lang', lang); } catch (e) { }
      apply();
    });
    apply();
    refreshLive();
  })();
</script>
</body>
</html>
