<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Planet ZenzizenziX — Monde 1 : Havre</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a1418;color:#e8e0f0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center}
#stage{position:relative;width:min(100vw,calc((100vh - 64px) * 16 / 9));aspect-ratio:16/9;background:#000;margin-top:4px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{width:min(100vw,calc((100vh - 64px) * 16 / 9));display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:6px 10px;font-size:12px;color:#b8acd0}
.bar b{color:#fff}.bar kbd{display:inline-block;min-width:16px;padding:0 4px;border:1px solid #4a3a6a;border-radius:3px;background:#1a1228;color:#fff;font:11px/16px ui-monospace,monospace;text-align:center}
.bar button{background:#2a1e40;color:#fff;border:1px solid #4a3a6a;border-radius:4px;padding:3px 9px;font:600 12px system-ui;cursor:pointer}
.bar button:hover{background:#3a2a58}.sp{margin-left:auto}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<div class="bar" id="help"></div>
<script>
/*JS*/
</script>
</body>
</html>
