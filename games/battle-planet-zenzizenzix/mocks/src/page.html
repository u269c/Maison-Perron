<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Battle Planet ZenzizenziX — maquette niveau 1 : Havre</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0710;color:#e8e0f0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center}
#stage{position:relative;width:100%;max-width:1600px;aspect-ratio:16/9;max-height:calc(100vh - 110px);background:#000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.bar{width:100%;max-width:1600px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 14px;font-size:13px;color:#b8acd0}
.bar b{color:#fff}.bar kbd{display:inline-block;min-width:18px;padding:0 5px;border:1px solid #4a3a6a;border-radius:3px;background:#1a1228;color:#fff;font:12px/18px ui-monospace,monospace;text-align:center}
.bar button{background:#2a1e40;color:#fff;border:1px solid #4a3a6a;border-radius:4px;padding:4px 10px;font:600 13px system-ui;cursor:pointer}
.bar button:hover{background:#3a2a58}.sp{margin-left:auto}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="bar" id="help"></div>
