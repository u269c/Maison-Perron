<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Planet ZenzizenziX — essais BD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1a1418;color:#f2e8d8;font:15px/1.45 "Trebuchet MS","DejaVu Sans",sans-serif}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:18px 24px 6px}h1{margin:0;font:900 26px Impact,"Arial Black",sans-serif;letter-spacing:.5px;color:#ffd23f;text-shadow:3px 3px 0 #c8302a}
header p{margin:0;color:#b8a898;flex:1}#lang{background:none;border:2px solid #ffd23f;color:#ffd23f;font-weight:bold;padding:4px 10px;cursor:pointer}
nav{display:flex;gap:8px;padding:8px 24px;flex-wrap:wrap}nav button{flex:1;min-width:150px;background:#2a2228;border:3px solid #0c0810;color:#f2e8d8;padding:8px 10px;cursor:pointer;text-align:left;box-shadow:4px 4px 0 #0c0810}
nav button b{display:block;font:900 20px Impact,"Arial Black",sans-serif;color:#ffd23f}nav button.on{background:#ffd23f;color:#0c0810;transform:translate(2px,2px);box-shadow:2px 2px 0 #0c0810}nav button.on b{color:#c8302a}
main{padding:10px 24px 30px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}@media(max-width:1000px){main{grid-template-columns:1fr}}
#stage{position:relative;width:100%;aspect-ratio:16/9;background:#f4ead8;box-shadow:8px 8px 0 #0c0810}#stage canvas{position:absolute;inset:0;width:100%;height:100%}
aside h2{margin:0 0 4px;font:900 30px Impact,"Arial Black",sans-serif;color:#ffd23f}aside .sub{color:#e8d8c0;font-style:italic;margin:0 0 12px}aside .for{background:#2a2228;border-left:4px solid #ffd23f;padding:10px 12px;margin:0}
aside .k{color:#8a7a70;font-size:13px;margin-top:14px}
#thumbs{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}#thumbs figure{margin:0;cursor:pointer}#thumbs img{width:100%;display:block;border:3px solid #0c0810;box-shadow:4px 4px 0 #0c0810}#thumbs figcaption{font:900 15px Impact,"Arial Black",sans-serif;color:#ffd23f;margin-top:6px}
@media(max-width:800px){#thumbs{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1 id="h1"></h1><p id="intro"></p><button id="lang"></button></header>
<nav id="nav"></nav>
<main><div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<aside><h2 id="sn"></h2><p class="sub" id="ss"></p><p class="for" id="sf"></p><p class="k" id="keys"></p></aside>
<div id="thumbs"></div></main>
<script>
/*ACTORS*/
/*SHADER*/
/*SCENE*/
const UI = { fr: { h1: 'ESSAIS « BANDE DESSINÉE »', intro: 'Niveau 1, le quai du Havre, cinq façons de l’imprimer. Même scène, même animation : seul le rendu change.', lang: 'EN', keys: 'Touches 1 à 5 : changer de style · Espace : pause · Les vignettes du bas sont figées au même instant.', for: 'Pour le jeu : ' },
  en: { h1: 'COMIC-BOOK TRIALS', intro: 'Level 1, the Havre quay, printed five ways. Same scene, same animation: only the rendering changes.', lang: 'FR', keys: 'Keys 1 to 5: switch style · Space: pause · The thumbnails below are frozen at the same moment.', for: 'For the game: ' } };
const gcv = document.getElementById('gl'), ocv = document.getElementById('ov'); gcv.width = ocv.width = W * K; gcv.height = ocv.height = H * K;
const ov = ocv.getContext('2d'); let GL = null; try { GL = initGL(gcv); } catch (e) { console.error(e); }
let SI = 0; try { SI = +localStorage.getItem('bp-comic-style') || 0; } catch (e) {}
let paused = false, clock = 0, last = performance.now();
function frame(t) { const CH = simulate(t, 1 / 60); render(t, SI, CH, ov); if (GL) GL.draw(scv, fcv, SI, t, K); else { const g = gcv.getContext('2d'); g.drawImage(scv, 0, 0); g.drawImage(fcv, 0, 0); } }
function ui() { const U = UI[LANG], S = STYLES[SI][LANG]; document.documentElement.lang = LANG; h1.textContent = U.h1; intro.textContent = U.intro; lang.textContent = U.lang; keys.textContent = U.keys;
  nav.innerHTML = STYLES.map((s, i) => `<button class="${i === SI ? 'on' : ''}" data-i="${i}"><b>${s.n} · ${s[LANG][0]}</b>${s[LANG][1]}</button>`).join('');
  sn.textContent = STYLES[SI].n + ' · ' + S[0]; ss.textContent = S[1]; sf.textContent = U.for + S[2];
  thumbs.querySelectorAll('figcaption').forEach((f, i) => f.textContent = STYLES[i].n + ' · ' + STYLES[i][LANG][0]); }
function pick(i) { SI = i; try { localStorage.setItem('bp-comic-style', i); } catch (e) {} ui(); }
nav.onclick = e => { const b = e.target.closest('button'); if (b) pick(+b.dataset.i); };
lang.onclick = () => { LANG = LANG === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('bp-lang', LANG); } catch (e) {} ui(); makeThumbs(); };
addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '5') pick(+e.key - 1); if (e.code === 'Space') { paused = !paused; e.preventDefault(); } });
function still(si, at) { PT = []; prevT = at - 1.2; for (let tt = at - 1.2; tt < at; tt += 1 / 60) { const CH = simulate(tt, 1 / 60); } const CH = simulate(at, 1 / 60); render(at, si, CH, ov); if (GL) GL.draw(scv, fcv, si, at, K); const out = document.createElement('canvas'); out.width = W; out.height = H; const g = out.getContext('2d'); g.drawImage(gcv, 0, 0, W, H); g.drawImage(ocv, 0, 0, W, H); return out.toDataURL('image/jpeg', .88); }
function makeThumbs() { const keep = SI; thumbs.innerHTML = STYLES.map((s, i) => `<figure data-i="${i}"><img src="${still(i, 5.45)}" alt=""><figcaption></figcaption></figure>`).join(''); thumbs.onclick = e => { const f = e.target.closest('figure'); if (f) pick(+f.dataset.i); }; PT = []; SI = keep; ui(); }
makeThumbs(); prevT = clock;
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; if (!paused) { clock += dt; frame(clock); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__still = still;
</script></body></html>
