<!DOCTYPE html>

<head>

<title>Battle Planet ZenzizenziX — maquette niveau 1 : Havre</title>
<style>
*{box-sizing:border-box}

.sp{margin-left:auto}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="bar" id="help"></div>

<script>
// =====================================================================
// Battle Planet ZenzizenziX — MOCK, level 1 (Havre, the home planet)
// Two random warriors from Les Douze, a 2.5D floor, crates, a water gap,
// and some of Villen-Hüüs's soldiers to punch. Not the game: a sandbox.
// =====================================================================
const VW = 480, VH = 270, FLOOR = 158, DEPTH = 100, LEVEL_W = 2400, GRAV = 700;
let LANG = (() => { try { return localStorage.getItem('bp-lang') || 'fr'; } catch (e) { return 'fr'; } })();
const T = {
  fr: { title: 'MAQUETTE · NIVEAU 1 · HAVRE', p1: 'J1', p2: 'J2', ready: 'PRÊT', special: 'SPÉCIAL', paused: 'PAUSE', fell: 'PLOUF !', go: 'Change de guerrier', reroll: 'Deux nouveaux guerriers', lang: 'English',
    help: '<b>J1</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> bouger · <kbd>Espace</kbd> sauter · <kbd>F</kbd> frapper · <kbd>G</kbd> spécial · <kbd>Q</kbd> changer', help2: '<b>J2</b> <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> · <kbd>Maj droite</kbd> sauter · <kbd>K</kbd> frapper · <kbd>L</kbd> spécial · <kbd>P</kbd> changer', help3: 'Manettes : ✕ sauter · □ frapper · ○ spécial · Select changer · <kbd>Échap</kbd> pause · <kbd>R</kbd> nouveaux guerriers' },
  en: { title: 'MOCK · LEVEL 1 · HAVRE', p1: 'P1', p2: 'P2', ready: 'READY', special: 'SPECIAL', paused: 'PAUSED', fell: 'SPLASH!', go: 'Switch warrior', reroll: 'Two new warriors', lang: 'Français',
    help: '<b>P1</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Space</kbd> jump · <kbd>F</kbd> attack · <kbd>G</kbd> special · <kbd>Q</kbd> switch', help2: '<b>P2</b> <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> · <kbd>Right Shift</kbd> jump · <kbd>K</kbd> attack · <kbd>L</kbd> special · <kbd>P</kbd> switch', help3: 'Gamepads: ✕ jump · □ attack · ○ special · Select switch · <kbd>Esc</kbd> pause · <kbd>R</kbd> new warriors' }
};

// ---- the twelve (stats from Les Douze: health, speed, power, reach, teamwork)
const WARRIORS = [
  { id: 'amiral', name: 'Amiral Remords', st: [4, 3, 4, 4, 4], sp: 'Mutiny Broadside', fx: 'broadside', look: { type: 'human', s: 1, top: '#2a3a7a', trim: '#e0b45a', pants: '#16161e', skin: '#d8a07a', hat: 'tricorn', beard: '#efe8dc', peg: 1, weapon: 'sabre' } },
  { id: 'marge', name: 'Marge la Roadie', st: [5, 2, 5, 2, 3], sp: 'Amp Dive', fx: 'ampdive', look: { type: 'human', s: 1.22, top: '#1c1616', trim: '#e8c77a', pants: '#4a2a4a', skin: '#e8b088', hat: 'mohawk', hair: '#ff4f8a' } },
  { id: 'cyborg', name: 'Le gros cyborg', st: [5, 1, 5, 3, 2], sp: 'Lava Roll', fx: 'lavaroll', look: { type: 'human', s: 1.36, top: '#4a4a54', pants: '#34343c', skin: '#8a8a94', hat: 'cyborg', seams: '#ff7a2a', bigArm: 1 } },
  { id: 'papi', name: 'Papi des marées', st: [4, 3, 4, 4, 3], sp: 'Rocket Stomp', fx: 'stomp', look: { type: 'rider' } },
  { id: 'ruby', name: 'Ruby Tonnerre', st: [3, 4, 4, 5, 3], sp: 'Thunder Chord', fx: 'thunder', look: { type: 'human', s: 1, top: '#141010', trim: '#d8dce0', pants: '#2a3a5a', skin: '#f0c8a0', hat: 'mohawk', hair: '#e0302a', weapon: 'guitar' } },
  { id: 'spora', name: 'Spora', st: [3, 3, 3, 4, 5], sp: 'Spore Cloud', fx: 'spores', look: { type: 'blob' } },
  { id: 'magneto', name: 'Docteur Magnéto', st: [4, 3, 5, 2, 3], sp: 'Magnet Slam', fx: 'magnet', look: { type: 'human', s: 1.3, top: '#2a3a7a', trim: '#c8963a', pants: '#2a3a7a', skin: '#c8885a', bareArms: 1, hat: 'mask', mask: '#c82a2a', glove: '#7ac8ff' } },
  { id: 'doc', name: 'Doc Suture', st: [3, 3, 2, 2, 5], sp: 'Field Patch', fx: 'patch', look: { type: 'human', s: .95, top: '#5a5a3a', pants: '#44442e', skin: '#e0b090', hat: 'bun', hair: '#bfb8ac', bag: 1 } },
  { id: 'demi', name: 'Demi', st: [3, 3, 4, 3, 3], sp: 'Flip Side', fx: 'flip', look: { type: 'cloak' } },
  { id: 'bernache', name: 'Bernache', st: [2, 5, 3, 2, 3], sp: 'HONK', fx: 'honk', look: { type: 'goose' } },
  { id: 'raccoon', name: 'Le raton de l\'espace', st: [2, 5, 3, 4, 2], sp: 'Rocket Pack', fx: 'rocket', look: { type: 'raccoon' } },
  { id: 'soldier', name: 'Jean-Louis Carnage', st: [3, 3, 4, 3, 3], sp: 'RAGE', fx: 'rage', look: { type: 'human', s: 1.05, top: '#4a5a2e', camo: 1, pants: '#46562c', skin: '#d86a4a', hat: 'helmet', helm: '#3a4a24' } }
];

// ---- canvas: a low-res game buffer scaled up crisp, HUD text drawn at screen resolution
const cv = document.getElementById('c'), out = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = VW; buf.height = VH; const g = buf.getContext('2d');
function resize() { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
addEventListener('resize', resize);

// ---- tiny sounds
let AC = null; function beep(f, d = .08, type = 'square', v = .05, slide = 0) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.value = f; if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), AC.currentTime + d); gn.gain.value = v; gn.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.connect(gn).connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch (e) {} }
function noise(d = .2, v = .08) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const n = AC.sampleRate * d, b = AC.createBuffer(1, n, AC.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(), gn = AC.createGain(); s.buffer = b; gn.gain.value = v; s.connect(gn).connect(AC.destination); s.start(); } catch (e) {} }

// ---- the level: crates (you can climb them), a raised pier, and a water gap
const BOXES = [
  { x: 300, z: 20, w: 26, d: 22, h: 22 }, { x: 326, z: 20, w: 26, d: 22, h: 22 }, { x: 313, z: 20, w: 26, d: 22, h: 44 },
  { x: 640, z: 62, w: 30, d: 26, h: 24 },
  { x: 980, z: 8, w: 26, d: 22, h: 22 }, { x: 1006, z: 8, w: 26, d: 22, h: 22 },
  { x: 1560, z: 0, w: 220, d: 44, h: 26, pier: 1 },
  { x: 1900, z: 70, w: 28, d: 24, h: 24 }, { x: 1928, z: 70, w: 28, d: 24, h: 24 }, { x: 1914, z: 70, w: 28, d: 24, h: 48 }
];
const HOLES = [{ x0: 1190, x1: 1262 }];
function ground(x, z) { for (const h of HOLES) if (x > h.x0 && x < h.x1) return -999; let gnd = 0; for (const b of BOXES) if (x > b.x && x < b.x + b.w && z > b.z && z < b.z + b.d) gnd = Math.max(gnd, b.h); return gnd; }
function blocked(x, z, y) { for (const b of BOXES) if (x > b.x - 3 && x < b.x + b.w + 3 && z > b.z - 2 && z < b.z + b.d + 2 && y < b.h - 3) return true; return false; }

// ---- entities
let players = [], enemies = [], fx = [], banners = [], camX = 0, paused = false, shake = 0, time = 0;
function hpMax(w) { return 4 + w.st[0] * 2; } // half-hearts
function makePlayer(i, w) { return { i, w, x: 80 + i * 40, z: 40 + i * 30, y: 0, vy: 0, vx: 0, face: 1, hp: hpMax(w), meter: 60, atk: 0, hitDone: false, walk: 0, inv: 0, safe: [80, 40], fall: 0, sp: 0, spT: 0, frozen: 0, state: '' }; }
function spawnEnemies() { enemies = [[220, 70], [460, 30], [560, 80], [820, 50], [900, 20], [1400, 60], [1480, 20], [1700, 80], [2050, 40], [2150, 75], [2250, 20]].map(([x, z]) => ({ x, z, y: 0, vy: 0, vx: 0, home: x, hp: 6, flash: 0, down: 0, frozen: 0, burn: 0, face: -1, walk: Math.random() * 6, t: Math.random() * 6 })); }
function pick2() { const a = WARRIORS.slice().sort(() => Math.random() - .5); return [a[0], a[1]]; }
function newGame(ws) { const [a, b] = ws || pick2(); players = [makePlayer(0, a), makePlayer(1, b)]; spawnEnemies(); fx = []; banners = []; camX = 0; }
function cycle(p) { const i = WARRIORS.indexOf(p.w); let n = (i + 1) % WARRIORS.length; if (WARRIORS[n] === players[1 - p.i].w) n = (n + 1) % WARRIORS.length; p.w = WARRIORS[n]; p.hp = hpMax(p.w); p.meter = 100; beep(660, .06); banner(p.w.name, p.i); }
function banner(text, who, big) { banners.push({ text, who, t: big ? 1.4 : 1.1, big }); }

// ---- input: two keyboard layouts + gamepads
const keys = new Set(); const pressed = new Set();
addEventListener('keydown', e => { if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); if (!keys.has(e.code)) pressed.add(e.code); keys.add(e.code); });
addEventListener('keyup', e => keys.delete(e.code));
const KB = [{ l: 'KeyA', r: 'KeyD', u: 'KeyW', d: 'KeyS', j: 'Space', a: 'KeyF', s: 'KeyG', c: 'KeyQ' }, { l: 'ArrowLeft', r: 'ArrowRight', u: 'ArrowUp', d: 'ArrowDown', j: 'ShiftRight', a: 'KeyK', s: 'KeyL', c: 'KeyP' }];
const padPrev = [{}, {}];
function readInput(i) {
  const k = KB[i]; const inp = { x: (keys.has(k.r) ? 1 : 0) - (keys.has(k.l) ? 1 : 0), z: (keys.has(k.d) ? 1 : 0) - (keys.has(k.u) ? 1 : 0), j: pressed.has(k.j), a: pressed.has(k.a), s: pressed.has(k.s), c: pressed.has(k.c), start: false };
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; const pad = pads[i];
  if (pad) { const b = n => pad.buttons[n] && pad.buttons[n].pressed, was = padPrev[i], edge = n => b(n) && !was[n];
    const ax = Math.abs(pad.axes[0]) > .3 ? pad.axes[0] : 0, az = Math.abs(pad.axes[1]) > .3 ? pad.axes[1] : 0;
    inp.x = inp.x || ax || (b(15) ? 1 : 0) - (b(14) ? 1 : 0); inp.z = inp.z || az || (b(13) ? 1 : 0) - (b(12) ? 1 : 0);
    inp.j = inp.j || edge(0); inp.a = inp.a || edge(2); inp.s = inp.s || edge(1); inp.c = inp.c || edge(8); inp.start = edge(9);
    padPrev[i] = Object.fromEntries(pad.buttons.map((x, n) => [n, x.pressed])); }
  return inp;
}

// ---- combat
function hit(target, dmg, dir, from, isPlayer) {
  if (isPlayer) { if (target.inv > 0 || target.sp > 0 && target.state === 'inv') return; const ff = from && from !== target; // friendly fire: half damage, never the last heart
    if (ff) dmg = Math.max(1, Math.floor(dmg / 2)); target.hp = Math.max(ff ? 1 : 0, target.hp - dmg); target.inv = .6; target.vx = dir * 120; if (target.hp <= 0) { target.hp = hpMax(target.w); target.inv = 2; banner('K.O.', target.i); } beep(140, .12, 'sawtooth', .06, -60); return; }
  if (target.down > 0) return; target.hp -= dmg; target.flash = .15; target.vx = dir * 140; target.frozen = 0; shake = Math.max(shake, 2);
  if (target.hp <= 0) { target.down = 3; target.vy = 160; target.y = Math.max(target.y, 1); noise(.15, .06); } else beep(220 + Math.random() * 60, .06, 'square', .05, -80);
  if (from) from.meter = Math.min(100, from.meter + 6);
}
function reachOf(p) { return 12 + p.w.st[3] * 4; }
function dmgOf(p) { return 1 + Math.floor(p.w.st[2] / 2); }
function strike(p) { // attack: horizontal, in the facing direction
  const R = reachOf(p), D = dmgOf(p);
  for (const e of enemies) if (Math.abs(e.z - p.z) < 12 && Math.abs(e.y - p.y) < 30 && (e.x - p.x) * p.face > -4 && Math.abs(e.x - p.x) < R) hit(e, D, p.face, p);
  const q = players[1 - p.i]; if (Math.abs(q.z - p.z) < 12 && Math.abs(q.y - p.y) < 30 && (q.x - p.x) * p.face > 0 && Math.abs(q.x - p.x) < R) hit(q, D, p.face, p, true);
}
function inRadius(p, r, dz = 50) { return enemies.filter(e => e.down <= 0 && Math.abs(e.x - p.x) < r && Math.abs(e.z - p.z) < dz); }
function partnerIn(p, r, dz = 50) { const q = players[1 - p.i]; return Math.abs(q.x - p.x) < r && Math.abs(q.z - p.z) < dz ? q : null; }
function special(p) {
  if (p.meter < 100) { beep(110, .05); return; } p.meter = 0; banner(p.w.sp, p.i, true); const f = p.face, q = players[1 - p.i];
  switch (p.w.fx) {
    case 'broadside': for (let k = 0; k < 3; k++) fx.push({ k: 'ball', x: p.x + f * 10, z: p.z - 10 + k * 10, y: 16, vx: f * 360, t: 1.6, from: p, delay: k * .12 }); fx.push({ k: 'smoke', x: p.x + f * 14, z: p.z, y: 16, t: .8 }); noise(.4, .1); shake = 6; break;
    case 'ampdive': p.vy = 260; p.state = 'dive'; p.sp = 2; break;
    case 'lavaroll': p.state = 'roll'; p.sp = .7; p.inv = .8; break;
    case 'stomp': p.state = 'roll'; p.sp = .5; p.inv = .6; p.after = 'shock'; break;
    case 'thunder': for (const e of inRadius(p, 240, 100).slice(0, 5)) { fx.push({ k: 'bolt', x: e.x, z: e.z, t: .35 }); e.frozen = 1.2; hit(e, 3, Math.sign(e.x - p.x) || 1, p); } fx.push({ k: 'ring', x: p.x, z: p.z, r: 0, max: 90, t: .5, col: '#9fd8ff' }); noise(.3, .1); shake = 5; break;
    case 'spores': fx.push({ k: 'cloud', x: p.x + f * 40, z: p.z, t: 4, r: 70, from: p }); for (const e of inRadius(p, 110, 60)) e.frozen = 3; if (partnerIn(p, 140, 60)) q.hp = Math.min(hpMax(q.w), q.hp + 2); beep(440, .3, 'sine', .05, 200); break;
    case 'magnet': for (const e of inRadius(p, 260, 100)) { e.pull = { x: p.x + f * 22, z: p.z }; } p.sp = .8; p.after = 'slam'; fx.push({ k: 'field', x: p.x, z: p.z, t: .8, from: p }); beep(90, .6, 'sawtooth', .05, 300); break;
    case 'patch': fx.push({ k: 'kit', x: p.x, z: p.z, y: 20, tx: q.x, tz: q.z, t: .7, T: .7, to: q }); beep(660, .1, 'triangle'); break;
    case 'flip': { p.fire = !p.fire; const list = enemies.filter(e => e.down <= 0 && (e.x - p.x) * f > 0 && Math.abs(e.x - p.x) < 140 && Math.abs(e.z - p.z) < 26); for (const e of list) { if (p.fire) { e.burn = 3; hit(e, 2, f, p); } else e.frozen = 3; } fx.push({ k: 'stream', x: p.x, z: p.z, f, t: .5, fire: p.fire }); noise(.3, .07); break; }
    case 'honk': for (const e of inRadius(p, 170, 70)) { hit(e, 1, Math.sign(e.x - p.x) || 1, p); e.flee = 3; } fx.push({ k: 'ring', x: p.x + f * 10, z: p.z, r: 0, max: 150, t: .6, col: '#fff4d8' }); beep(330, .35, 'sawtooth', .09, -120); shake = 4; break;
    case 'rocket': p.state = 'fly'; p.sp = 2.2; p.inv = 2.4; p.vy = 0; p.shots = 0; beep(200, .5, 'sawtooth', .04, 400); break;
    case 'rage': p.inv = 3; p.rage = 3; for (const e of inRadius(p, 160, 60)) { e.vx = Math.sign(e.x - p.x) * 320; hit(e, 2, Math.sign(e.x - p.x) || 1, p); } { const qq = partnerIn(p, 160, 60); if (qq) qq.vx = Math.sign(qq.x - p.x) * 240; } fx.push({ k: 'ring', x: p.x, z: p.z, r: 0, max: 170, t: .5, col: '#ff4a2a' }); noise(.5, .1); shake = 7; break;
  }
}

// ---- update
function update(dt) {
  time += dt;
  if (pressed.has('Escape')) paused = !paused; if (pressed.has('KeyR')) { newGame(); }
  const inputs = [readInput(0), readInput(1)]; if (inputs.some(x => x.start)) paused = !paused;
  if (paused) { pressed.clear(); return; }
  for (const p of players) {
    const inp = inputs[p.i]; if (inp.c) cycle(p);
    const spd = (46 + p.w.st[1] * 14) * (p.rage > 0 ? 1.3 : 1);
    p.inv = Math.max(0, p.inv - dt); p.rage = Math.max(0, (p.rage || 0) - dt); p.meter = Math.min(100, p.meter + dt * 9);
    if (p.fall > 0) { p.fall -= dt; p.y -= 60 * dt; if (p.fall <= 0) { p.x = p.safe[0]; p.z = p.safe[1]; p.y = 0; p.vy = 0; p.hp = Math.max(1, p.hp - 2); p.inv = 1.5; } continue; }
    // specials with movement
    if (p.sp > 0) { p.sp -= dt;
      if (p.state === 'roll') { const nx = p.x + p.face * 300 * dt; if (!blocked(nx, p.z, p.y)) p.x = nx; for (const e of inRadius(p, 22, 16)) { hit(e, 2, p.face, p); e.vy = 150; e.y = Math.max(1, e.y); } if (p.w.fx === 'lavaroll' && Math.random() < .6) fx.push({ k: 'lava', x: p.x - p.face * 8, z: p.z, t: 2.5, from: p }); if (p.sp <= 0 && p.after === 'shock') { p.after = null; fx.push({ k: 'ring', x: p.x, z: p.z, r: 0, max: 110, t: .5, col: '#e8f4ff' }); for (const e of inRadius(p, 110, 50)) { e.vy = 200; e.y = Math.max(1, e.y); hit(e, 2, Math.sign(e.x - p.x) || 1, p); } shake = 6; noise(.3, .1); } }
      if (p.state === 'fly') { p.y += (60 - p.y) * dt * 4; if (p.sp < 1.8 && p.shots < 3 && p.sp < 1.8 - p.shots * .4) { p.shots++; fx.push({ k: 'zap', x: p.x + p.face * 8, z: p.z, y: p.y + 20, vx: p.face * 260, vy: -150, t: 1, from: p }); beep(880, .08, 'square', .04, -400); } }
      if (p.sp <= 0) { if (p.after === 'slam') { p.after = null; fx.push({ k: 'ring', x: p.x + p.face * 22, z: p.z, r: 0, max: 80, t: .4, col: '#9fd0ff' }); for (const e of inRadius(p, 70, 40)) { hit(e, 4, p.face, p); e.vy = 220; e.y = Math.max(1, e.y); } shake = 8; noise(.35, .12); } p.state = ''; }
    }
    // walking
    let mx = inp.x, mz = inp.z; if (p.state === 'roll') { mx = 0; }
    if (Math.abs(mx) > .1) p.face = Math.sign(mx);
    const nx = p.x + mx * spd * dt + p.vx * dt, nz = p.z + mz * spd * .62 * dt; p.vx *= Math.pow(.02, dt);
    if (!blocked(nx, p.z, p.y)) p.x = nx; if (!blocked(p.x, nz, p.y)) p.z = nz;
    p.z = Math.max(0, Math.min(DEPTH, p.z));
    const minX = camX + 10, maxX = camX + VW - 10; p.x = Math.max(Math.max(10, minX), Math.min(Math.min(LEVEL_W - 10, maxX), p.x));
    p.walk += (Math.abs(mx) + Math.abs(mz) > .1 ? dt * 12 : 0);
    // jumping and gravity (towers: you can land on crates)
    const gnd = ground(p.x, p.z);

      const sw = Math.sin(p.walk) * 2; R(-4 + sw, -5, 2, 5, '#2a2420'); R(1 - sw, -5, 2, 5, '#2a2420');
      break; }
    case 'raccoon': {
      const sw = Math.sin(p.walk) * 2; S.s = .9;
      for (let k = 0; k < 5; k++) R(-10 - k * 2, -16 + k, 3, 4, k % 2 ? '#2a2420' : '#8a7a6a');
      R(-4 + sw, -10, 3, 10, '#c8862a'); R(1 - sw, -10, 3, 10, '#e0a040'); R(-6, -24, 11, 14, '#d8962a'); R(-9, -24, 4, 10, '#5a5a66');
      if (p.state === 'fly') { R(-9, -14, 3, 6, '#9fdcff'); R(-8, -8, 2, 6 + Math.floor(time * 30) % 3, '#e8f8ff'); }
      R(-4, -34, 10, 10, '#a8a098'); R(-4, -31, 10, 3, '#141210'); px(0, -30, '#f6e8b0'); px(4, -30, '#f6e8b0'); R(4, -27, 4, 3, '#efe8de'); px(7, -27, '#141210');
      R(-4, -36, 3, 3, '#5a5450'); R(3, -36, 3, 3, '#7a726c');
      if (a.atk) { R(4, -21, 8, 3, '#d8962a'); R(12, -22, 6, 3, '#3a3a44'); px(18, -21, '#8affc8'); } else R(4, -22, 3, 8, '#d8962a');
      break; }
  }
}
function drawEnemy(e) {
  const x = e.x - camX, y = sy(e.z, e.y); if (x < -30 || x > VW + 30) return; shadow(e.x, e.z, e.y, 9);
  S = { ox: Math.round(x), oy: Math.round(y), s: 1, f: e.face };
  const sw = Math.sin(e.walk) * 2, body = e.flash > 0 ? '#ffffff' : e.frozen > 0 ? '#9fc8e8' : '#2a2230', arm = e.flash > 0 ? '#ffffff' : e.frozen > 0 ? '#b8d8f0' : '#3a3044';
  if (e.down > 0) { S.oy += 0; R(-14, -6, 26, 6, body); R(10, -8, 7, 7, body); R(13, -6, 3, 2, '#ff6a3a'); return; }
  R(-4 - sw, -13, 3, 13, body); R(1 + sw, -13, 3, 13, body); R(-6, -30, 12, 17, arm); R(-5, -40, 10, 10, body); R(-1, -37, 6, 2, '#ff6a3a');
  R(4, -28, 8, 3, body); R(11, -30, 6, 2, '#151015');
  if (e.burn > 0) for (let k = 0; k < 3; k++) px(-4 + k * 4, -32 - Math.floor(time * 10 + k) % 6, '#ffb040');
  if (e.frozen > 0) { g.fillStyle = 'rgba(200,235,255,.25)'; g.fillRect(Math.round(x - 9), Math.round(y - 44), 18, 44); }
}
function drawFx(f) {
  const x = f.x - camX, y = sy(f.z, f.y || 0);
  switch (f.k) {
    case 'ring': g.strokeStyle = f.col; g.globalAlpha = Math.max(0, Math.min(1, f.t / (f.T || .6))); g.lineWidth = 2; g.beginPath(); g.ellipse(x, sy(f.z, 0), Math.max(.1, f.r || 0), Math.max(.1, (f.r || 0) * .35), 0, 0, 7); g.stroke(); g.globalAlpha = 1; g.lineWidth = 1; break;
    case 'ball': if (f.delay > 0) break; g.fillStyle = '#1a1614'; g.fillRect(Math.round(x - 3), Math.round(y - 3), 6, 6); g.fillStyle = 'rgba(255,230,180,.6)'; g.fillRect(Math.round(x - f.vx / 30 - 8), Math.round(y - 1), 8, 2); break;
    case 'smoke': g.fillStyle = `rgba(230,220,200,${f.t})`; for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + k * 6 * Math.sign(f.vx || 1), y - k * 3, 6 + k, 0, 7); g.fill(); } break;
    case 'bolt': g.strokeStyle = '#e8f4ff'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, 0); for (let k = 1; k <= 6; k++) g.lineTo(x + (Math.random() - .5) * 14, (sy(f.z, 30)) * k / 6); g.stroke(); g.lineWidth = 1; g.fillStyle = 'rgba(200,230,255,.3)'; g.fillRect(0, 0, VW, VH); break;
    case 'cloud': for (let k = 0; k < 18; k++) { const a = k * 2.4 + time, r = (k * 7) % f.r; g.fillStyle = `rgba(220,240,140,${.35 * Math.min(1, f.t)})`; g.fillRect(Math.round(x + Math.cos(a) * r), Math.round(sy(f.z, 0) - 10 - ((k * 13 + time * 20) % 50)), 2, 2); } g.fillStyle = `rgba(160,255,190,${.08 * Math.min(1, f.t)})`; g.beginPath(); g.ellipse(x, sy(f.z, 0), f.r, f.r * .35, 0, 0, 7); g.fill(); break;
    case 'field': g.strokeStyle = 'rgba(140,200,255,.8)'; for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(x, y - 20, 20 + k * 30 + (time * 80) % 30, -1, 1); g.stroke(); g.beginPath(); g.arc(x, y - 20, 20 + k * 30 + (time * 80) % 30, 2.1, 4.2); g.stroke(); } break;
    case 'kit': g.fillStyle = '#efe6d2'; g.fillRect(Math.round(x - 3), Math.round(y - 3), 7, 6); g.fillStyle = '#3a8a4a'; g.fillRect(Math.round(x), Math.round(y - 2), 1, 4); g.fillRect(Math.round(x - 1), Math.round(y - 1), 3, 1); break;
    case 'plus': g.fillStyle = `rgba(140,255,170,${f.t})`; for (let k = 0; k < 3; k++) { const yy = y - 30 - (1 - f.t) * 20 - k * 8, xx = x - 6 + k * 6; g.fillRect(xx, yy - 2, 1, 5); g.fillRect(xx - 2, yy, 5, 1); } break;
    case 'stream': g.fillStyle = f.fire ? 'rgba(255,140,50,.8)' : 'rgba(170,220,255,.8)'; for (let k = 0; k < 20; k++) g.fillRect(Math.round(x + f.f * (10 + k * 7)), Math.round(y - 22 + Math.sin(k + time * 30) * 3), 4, 3); break;
    case 'lava': g.fillStyle = `rgba(255,${100 + Math.random() * 80 | 0},30,${Math.min(1, f.t)})`; g.fillRect(Math.round(x - 4), Math.round(sy(f.z, 0) - 2), 8, 3); break;
    case 'amp': { const ax = Math.round(x - 10), ay = Math.round(sy(f.z, 0)); g.fillStyle = '#141010'; g.fillRect(ax, ay - 18, 20, 18); g.fillStyle = '#2a2020'; g.beginPath(); g.arc(ax + 10, ay - 9, 6, 0, 7); g.fill(); g.fillStyle = 'rgba(255,220,160,.4)'; g.fillRect(ax, ay - 18, 20, 1); break; }
    case 'zap': g.fillStyle = '#8affc8'; g.fillRect(Math.round(x - 2), Math.round(y - 1), 5, 2); break;
  }
}

function render() {
  g.save(); if (shake > 0) g.translate(Math.round((Math.random() - .5) * shake), Math.round((Math.random() - .5) * shake));
  background(); floor();
  // depth sort: crates by their front edge; fighters standing on a crate drawn after it
  const items = [];
  for (const b of BOXES) items.push({ key: b.z + b.d, draw: () => drawBox(b) });
  const keyOf = o => { let k = o.z; for (const b of BOXES) if (o.x > b.x && o.x < b.x + b.w && o.z > b.z && o.z < b.z + b.d && o.y >= b.h - 1) k = Math.max(k, b.z + b.d + .01); return k; };
  for (const e of enemies) items.push({ key: keyOf(e), draw: () => drawEnemy(e) });
  for (const p of players) items.push({ key: keyOf(p) + (p.fall > 0 ? -50 : 0), draw: () => drawWarrior(p) });
  for (const f of fx) items.push({ key: f.z + .5, draw: () => drawFx(f) });
  items.sort((a, b) => a.key - b.key).forEach(i => i.draw());
  g.restore();
  // composite onto the screen canvas, then HUD at full resolution
  out.imageSmoothingEnabled = false; out.fillStyle = '#000'; out.fillRect(0, 0, cv.width, cv.height);
  const sc = Math.min(cv.width / VW, cv.height / VH), w = VW * sc, h = VH * sc, ox = (cv.width - w) / 2, oy = (cv.height - h) / 2;
  out.drawImage(buf, ox, oy, w, h); hud(ox, oy, sc);
}
function heart(x, y, s, fillAmt) { out.fillStyle = '#3a1a2a'; const P = [[1, 0], [2, 0], [4, 0], [5, 0], [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [6, 2], [1, 3], [2, 3], [3, 3], [4, 3], [5, 3], [2, 4], [3, 4], [4, 4], [3, 5]];
  for (const [a, b] of P) { out.fillStyle = a < 3.5 ? (fillAmt >= 1 ? '#ff4f6a' : fillAmt > 0 ? '#ff4f6a' : '#3a1a2a') : (fillAmt >= 2 ? '#ff4f6a' : '#3a1a2a'); out.fillRect(x + a * s, y + b * s, s, s); } }
function hud(ox, oy, sc) {
  const L = T[LANG], s = Math.max(1, Math.round(sc * .9));
  out.textBaseline = 'top';
  for (const p of players) {
    const right = p.i === 1, bx = right ? ox + VW * sc - 14 * sc : ox + 8 * sc, by = oy + 6 * sc, al = right ? 'right' : 'left';
    out.textAlign = al; out.font = `800 ${Math.round(7 * sc)}px system-ui,sans-serif`; out.fillStyle = '#000'; out.fillText(`${right ? L.p2 : L.p1} · ${p.w.name}`, bx + sc * .6, by + sc * .6); out.fillStyle = right ? '#8ad8ff' : '#ffb0d0'; out.fillText(`${right ? L.p2 : L.p1} · ${p.w.name}`, bx, by);
    const hearts = hpMax(p.w) / 2, hs = s * 1.4;
    for (let k = 0; k < hearts; k++) { const x = right ? bx - (k + 1) * 9 * hs * .9 : bx + k * 9 * hs * .9; heart(x, by + 10 * sc, hs, Math.max(0, Math.min(2, p.hp - k * 2))); }
    const mw = 60 * sc, mx = right ? bx - mw : bx, my = by + 20 * sc; out.fillStyle = '#1a1228'; out.fillRect(mx, my, mw, 4 * sc); out.fillStyle = p.meter >= 100 ? (Math.floor(time * 6) % 2 ? '#ffd23f' : '#fff4b0') : '#b08c00'; out.fillRect(mx + (right ? mw * (1 - p.meter / 100) : 0), my, mw * p.meter / 100, 4 * sc);
    out.font = `700 ${Math.round(5 * sc)}px system-ui,sans-serif`; out.fillStyle = p.meter >= 100 ? '#ffd23f' : '#9a8ab8'; out.fillText(p.meter >= 100 ? `${L.special} ${L.ready} · ${p.w.sp}` : `${L.special} · ${p.w.sp}`, right ? bx : bx, my + 5 * sc);
  }
  out.textAlign = 'center'; out.font = `700 ${Math.round(5 * sc)}px system-ui,sans-serif`; out.fillStyle = 'rgba(255,255,255,.55)'; out.fillText(L.title, ox + VW * sc / 2, oy + 6 * sc);
  // banners: special names, K.O., splash
  banners.forEach((b, i) => { const a = Math.min(1, b.t * 3); out.globalAlpha = a; out.font = `900 ${Math.round((b.big ? 16 : 10) * sc)}px system-ui,sans-serif`; out.textAlign = 'center'; const x = ox + (b.who === 0 ? VW * .3 : VW * .7) * sc, y = oy + (70 + i * 4) * sc;
    out.lineWidth = 4 * sc; out.strokeStyle = '#0a0710'; out.strokeText(b.text, x, y); out.fillStyle = b.who === 0 ? '#ffb0d0' : '#8ad8ff'; out.fillText(b.text, x, y); out.globalAlpha = 1; });
  if (paused) { out.fillStyle = 'rgba(10,7,16,.6)'; out.fillRect(ox, oy, VW * sc, VH * sc); out.fillStyle = '#fff'; out.font = `900 ${Math.round(20 * sc)}px system-ui`; out.textAlign = 'center'; out.fillText(L.paused, ox + VW * sc / 2, oy + VH * sc / 2 - 10 * sc); }
}

// ---- help bar (outside the canvas)
function helpBar() { const L = T[LANG]; document.documentElement.lang = LANG;
  document.getElementById('help').innerHTML = `<span>${L.help}</span><span>${L.help2}</span><span>${L.help3}</span><span class="sp"></span><button id="b-reroll" type="button">${L.reroll}</button><button id="b-lang" type="button">${L.lang}</button>`;
  document.getElementById('b-reroll').onclick = () => { newGame(); cv.focus(); }; document.getElementById('b-lang').onclick = () => { LANG = LANG === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('bp-lang', LANG); } catch (e) {} helpBar(); }; }

// ---- main loop
newGame(); resize(); helpBar();
let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
